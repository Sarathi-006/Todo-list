<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>TaskFlow</h1>
            <p>Organize your day. Get things done.</p>
        </header>

        <main>
            <div class="input-section">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a new task..."
                >
                <button id="addTaskBtn">Add Task</button>
            </div>

            <div class="task-info">
                <span id="taskCount">0 tasks</span>
                <button id="clearCompleted">Clear Completed</button>
            </div>

            <ul id="taskList"></ul>

            <p id="emptyMessage">No tasks yet. Add your first task!</p>
        </main>

        <footer>
            <p>Designed by <strong>PARTHASARATHI S</strong> | Register No: <strong>212223040144</strong></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
